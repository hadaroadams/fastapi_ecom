services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: shop
      POSTGRES_PASSWORD: shop
      POSTGRES_DB: ecommerce
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shop -d ecommerce"]
      interval: 2s
      retries: 10

  api:
    build: .
    ports:
      - "8000:8000"
    env_file: .env.local
    environment:
      DATABASE_URL: postgresql+psycopg://shop:shop@db:5432/ecommerce
      DEBUG: "false"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata: